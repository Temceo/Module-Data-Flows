<!DOCTYPE html>
<html lang="en">

<head>
  <title> Book Library</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"></script>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
  <link rel="stylesheet" type="text/css" href="style.css">
</head>

<body>
  <main>
    <header>
      <div class="jumbotron text-center">
        <h1>Library</h1>
        <p>Add books to your virtual library</p>
      </div>

      <button data-toggle="collapse" data-target="#demo" class="btn btn-info">
        Add new book
      </button>

      <div id="demo" class="collapse">
        <form class="form-group" id="add-book">
          <div>
            <label for="title">Title:</label>
            <input type="text" class="form-control" id="title" name="title" required>
            <span class="error error-title"></span>
          </div>
          <div>
            <label for="author">Author: </label>
            <input type="text" class="form-control" id="author" name="author" required>
            <span class="error error-author"></span>
          </div>
          <div>
            <label for="pages">Pages:</label>
            <input type="number" class="form-control" id="pages" name="pages" min="1" required>
            <span class="error error-pages"></span>
          </div>

          <label class="form-check-label" for="check">
            <input type="checkbox" class="form-check-input" id="check" name="check" value="read">Read
          </label>

          <input type="submit" value="Submit" class="btn btn-primary" id="submit-button">
        </form>
      </div>
    </header>
    <table id="book-table">
      <thead>
        <tr>
          <th>Title</th>
          <th>Author</th>
          <th>Pages</th>
          <th>Read</th>
          <th>Delete</th>
        </tr>
      </thead>
      <tbody id="display-books">

      </tbody>
    </table>


  </main>

  <script src="script.js" type="module"></script>
</body>

</html>
